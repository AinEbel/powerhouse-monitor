<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>E.BOX readings</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--text:#e8e8ea;--muted:#9aa0aa;--ok:#4ade80;--bad:#f87171;--line:#2a2e37}
@media (prefers-color-scheme: light){:root{--bg:#f5f6f8;--card:#fff;--text:#16181d;--muted:#5f6670;--ok:#15803d;--bad:#b91c1c;--line:#e3e5e9}}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,sans-serif}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 4px} .muted{color:var(--muted);font-size:13px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.r{border:1px solid var(--line);border-radius:10px;padding:10px}
.r b{font-size:24px;font-variant-numeric:tabular-nums} .r small{color:var(--muted);margin-left:4px}
.k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ok{color:var(--ok)} .bad{color:var(--bad)}
</style></head><body><main>
<h1>E.BOX readings</h1>
<div class="muted" id="st">Loading…</div>
<div id="boxes"></div>
</main>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ORDER = ['voltage', 'current', 'kwh', 'power', 'frequency'];
async function load() {
  let s; try { s = await (await fetch('api/ebox/status', {cache: 'no-store'})).json(); } catch (e) { return; }
  const when = s.updated ? new Date(s.updated).toLocaleString() : 'not yet';
  document.getElementById('st').innerHTML = !s.on ? '<span class="bad">Off: set EBOX_USER and EBOX_PASS on Render.</span>'
    : `<span class="${s.conn === 'online' ? 'ok' : 'bad'}">${esc(s.conn)}</span> · last reading ${esc(when)} · every ${s.pollSeconds} s${s.error ? ' · <span class="bad">' + esc(s.error) + '</span>' : ''}`;
  document.getElementById('boxes').innerHTML = (s.boxes || []).map(b => `<div class="box"><b>${esc(b.name)}</b>
    <div class="grid">${b.readings.length ? b.readings.sort((x, y) => ORDER.indexOf(x.kind) - ORDER.indexOf(y.kind)).map(r =>
      `<div class="r"><div class="k">${esc(r.kind)}</div><div>${esc(r.label)}</div><b>${esc(r.value)}</b><small>${esc(r.unit)}</small></div>`).join('')
      : '<div class="muted">No voltage, current or kWh values found on this E.BOX yet.</div>'}</div></div>`).join('');
}
load(); setInterval(load, 10000);
</script></body></html>
