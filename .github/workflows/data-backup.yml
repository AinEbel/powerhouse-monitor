# Saves a copy of all recorded data from the live site (read only, changes nothing on the site).
name: data-backup
on:
  push:
    branches: [data-backup]
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Download all recorded data
        env:
          SITE: https://aldhour-powerhouse.onrender.com
        run: |
          set -e
          mkdir -p backup/history && cd backup
          get() { curl -fsS --retry 5 --retry-delay 10 --max-time 120 "$SITE$1" -o "$2"; }
          get /api/status warmup.json || sleep 60
          get /api/backup backup.json
          get /api/mahfara/backup mahfara-backup.json
          get /api/refuels refuels.json
          get /api/fuellog.csv fuel-level-log.csv
          get /api/fuellog fuellog.json
          get /api/status status.json
          get /api/mahfara/status mahfara-status.json
          now=$(($(date +%s) * 1000)); from=$((now - 30 * 86400000)); w=$((300 * 60000))
          for ((a = from; a < now; a += w)); do get "/api/history?from=$a&to=$((a + w - 1))" "history/$a.json"; done
          rm -f warmup.json
          ls -la . && wc -c backup.json mahfara-backup.json refuels.json fuel-level-log.csv && ls history | wc -l
          node -e '
          const fs=require("fs"),J=f=>JSON.parse(fs.readFileSync(f));const b=J("backup.json"),m=J("mahfara-backup.json"),r=J("refuels.json"),s=J("status.json");
          let h=0;for(const f of fs.readdirSync("history"))h+=J("history/"+f).points.length;
          const fl=fs.readFileSync("fuel-level-log.csv","utf8").trim().split("\n").length-1;
          console.log("::notice title=Backup summary::today "+b.cons.day+" kWh="+Math.round(b.cons.kwh||0)+" fuel="+Math.round(b.cons.total)+" L | days="+Object.keys(b.mon.daily).length+" | solar total="+Math.round(b.sol.kwh)+" kWh | refuels="+r.list.length+" | fuel log lines="+fl+" | chart points="+h+" | alarm="+(s.alarm&&s.alarm.litres)+" | mahfara days="+Object.keys(m.mon.daily).length+" solar="+Math.round(m.sol.kwh));'
      - uses: actions/upload-artifact@v4
        with:
          name: al-dhour-data-backup
          path: backup
          retention-days: 90
